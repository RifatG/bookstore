# Global settings
global:
  namespace: bookstore

# Redis settings
redis:
  image: redis:7-alpine
  storageSize: 1Gi
  port: 6379

# Application settings
app:
  image:
    repository: rifatg13/bookstore-app   # твой Docker ID
    tag: latest
    pullPolicy: Always
  port: 8085
  replicas: 1
  resources:
    limits:
      memory: 1Gi
      cpu: 500m
    requests:
      memory: 512Mi
      cpu: 250m
  env:
    SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/postgres
    SPRING_DATASOURCE_USERNAME: postgres
    SPRING_DATASOURCE_PASSWORD: "853496"
    SPRING_REDIS_HOST: redis
    SPRING_REDIS_PORT: "6379"

# Ingress settings
ingress:
  enabled: true
  host: bookstore.local
  ingressClassName: nginx

ingress-nginx:
  enabled: true
  controller:
    service:
      type: NodePort

# ServiceMonitor (for Prometheus)
serviceMonitor:
  enabled: true
  path: /actuator/prometheus
  interval: 30s

# Включает/выключает установку мониторинга
monitoring:
  enabled: true

# Настройки для kube-prometheus-stack (передаются внутрь зависимого чарта)
kube-prometheus-stack:
  grafana:
    adminPassword: admin123
    service:
      type: LoadBalancer
    additionalDataSources:
      - name: Loki
        type: loki
        url: http://loki:3100
        access: proxy
        isDefault: false
  prometheus:
    prometheusSpec:
      serviceMonitorSelectorNilUsesHelmValues: false

# Grafana Loki (Временно отключен из-за проблем с правами на запись в кластере kind)
loki:
  enabled: false

loki-stack:
  loki:
    auth_enabled: false
    persistence:
      enabled: false
    config:
      schema_config:
        configs:
          - from: 2024-01-01
            store: boltdb-shipper
            object_store: inmemory
            schema: v11
            index:
              prefix: index_
              period: 24h
      storage_config:
        boltdb_shipper:
          active_index_directory: /loki/index
          cache_location: /loki/index_cache
          shared_store: inmemory
        filesystem:
          directory: /loki/chunks
      ingester:
        lifecycler:
          ring:
            kvstore:
              store: inmemory

  promtail:
    enabled: false
    config:
      clients:
        - url: http://loki:3100/loki/api/v1/push
      snippets:
        scrapeConfigs: |
          - job_name: kubernetes-pods
            kubernetes_sd_configs:
              - role: pod
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_app]
                target_label: app
              - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                target_label: app_kubernetes_io_name
              - source_labels: [__meta_kubernetes_namespace]
                target_label: namespace
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: pod
              - source_labels: [__meta_kubernetes_pod_container_name]
                target_label: container

  grafana:
    enabled: false  # используем существующий Grafana из kube-prometheus-stack